---
- name: Install and configure Nginx on webservers
  gather_facts: true
  hosts: webservers
  vars:
    ansible_ssh_user: user
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519 # или путь к вашему ключу
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Ensure nginx is running and enabled
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Create a custom index.html
      copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head><title>{{ ansible_hostname }}</title></head>
          <body>
          <h1>Welcome to {{ ansible_hostname }}</h1>
          <p>Deployed by Ansible</p>
          </body>
          </html>
      notify: restart nginx

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted